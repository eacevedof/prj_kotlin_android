ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ ApplicationKt.module ]
    }
}

jwt {
    secret = "pos-secret-key-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "pos-api"
    audience = "pos-users"
    realm = "pos-api"
}

database {
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    name = "pos_db"
    name = ${?DB_NAME}
    user = "postgres"
    user = ${?DB_USER}
    password = "postgres"
    password = ${?DB_PASSWORD}
}
